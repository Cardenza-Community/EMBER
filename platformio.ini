; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:cardputer-adv]
platform = espressif32 @ 6.7.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags = 
	-DESP32S3
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DCORE_DEBUG_LEVEL=3
lib_deps = 
	m5stack/M5Cardputer @ ^1.1.1
	https://github.com/earlephilhower/ESP8266Audio.git#1.9.7
	https://github.com/203Null/M5Unified.git#74fe31c6d9a2bd7c04f81eb4f8f0af99262e3bc2
	m5stack/M5GFX@0.2.31
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB

[platformio]
default_envs = unified
description = EMBER


; Runtime Cardenza / original Cardputer / ADV; existing CI uses cardenza alias.
[env:unified]
extends = env:cardputer-adv
board_build.flash_mode = qio
board_build.f_flash = 80000000L
build_flags =
    ${env:cardputer-adv.build_flags}
    -DLAUNCHER_NVS_GUARD
    -Wl,--wrap=esp_partition_erase_range
lib_deps =
    m5stack/M5Cardputer@1.1.1
    https://github.com/203Null/M5Unified.git#74fe31c6d9a2bd7c04f81eb4f8f0af99262e3bc2
    m5stack/M5GFX@0.2.31
    https://github.com/earlephilhower/ESP8266Audio.git#1.9.7

[env:cardenza]
extends = env:unified
